<style>
.wall{position:absolute;left:0;right:0;top:0;height:1450px}
.floor{position:absolute;left:0;right:0;top:1450px;bottom:0;background:repeating-linear-gradient(90deg,#c9b08c 0 178px,#bda27c 178px 180px)}
.floor::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px;background:#f4f1ea}
.unit4{position:absolute;border:14px solid var(--navy);border-radius:22px;background:linear-gradient(#22346e,#1a2754);overflow:hidden;box-shadow:0 40px 80px rgba(21,34,73,.28)}
.unit4 .door{position:absolute;inset:0;background:repeating-linear-gradient(#e3e8f0 0 40px,#b9c3d3 40px 46px);z-index:5}
.dopen{animation:dopen .55s cubic-bezier(.65,0,.35,1) var(--d) both}
.dclose{animation:dclose .5s cubic-bezier(.65,0,.35,1) var(--d) both}
@keyframes dopen{from{transform:translateY(0)}to{transform:translateY(-100%)}}
@keyframes dclose{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.fly{animation:fly .7s cubic-bezier(.3,.8,.3,1.05) var(--d) both}
@keyframes fly{0%{transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(1.3);opacity:0}15%{opacity:1}100%{transform:none;opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
.cal{position:absolute;width:250px;height:250px;border-radius:30px;background:#fff;box-shadow:0 20px 40px rgba(21,34,73,.18);overflow:hidden;text-align:center;color:var(--navy)}
.cal .top{height:70px;background:var(--navy);position:relative}
.cal .top::before,.cal .top::after{content:"";position:absolute;top:-14px;width:18px;height:44px;border-radius:9px;background:#8fc9f2}
.cal .top::before{left:56px}.cal .top::after{right:56px}
.cal .n{font-family:'Alexandria';font-weight:900;font-size:100px;line-height:120px}
.cal .l{font-family:'Alexandria';font-weight:800;font-size:40px;margin-top:-14px}
.lbl{position:absolute;background:#fff;color:var(--navy);font-family:'Alexandria';font-weight:800;font-size:44px;padding:8px 30px 14px;border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.pill{display:inline-block;font-family:'Alexandria';font-weight:900;font-size:80px;padding:14px 56px 24px;border-radius:999px}
.path{position:absolute;height:0;border-top:8px dashed rgba(143,201,242,.55)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
{{SYMBOLS}}
  <symbol id="plane" viewBox="0 0 240 120"><path d="M10 62Q10 48 30 46L170 40Q228 40 234 60Q228 80 170 80L30 76Q10 74 10 62Z" fill="#fff"/><path d="M110 46L70 2H96L150 44Z" fill="#8fc9f2"/><path d="M110 76L70 118H96L150 78Z" fill="#8fc9f2"/><path d="M28 48L8 18H26L52 46Z" fill="#8fc9f2"/><g fill="#152249"><circle cx="190" cy="56" r="5"/><circle cx="172" cy="56" r="5"/><circle cx="154" cy="56" r="5"/><circle cx="136" cy="56" r="5"/></g></symbol>
  <symbol id="suitcase" viewBox="0 0 160 220"><rect x="55" y="0" width="50" height="34" rx="10" fill="none" stroke="#152249" stroke-width="10"/><rect x="10" y="30" width="140" height="170" rx="22" fill="#2e78b8"/><rect x="38" y="30" width="12" height="170" fill="#5fa9de"/><rect x="110" y="30" width="12" height="170" fill="#5fa9de"/><circle cx="40" cy="208" r="11" fill="#152249"/><circle cx="120" cy="208" r="11" fill="#152249"/></symbol>
  <symbol id="bill" viewBox="0 0 160 200"><path d="M0 0H160V200L140 186L120 200L100 186L80 200L60 186L40 200L20 186L0 200Z" fill="#fff"/><rect x="20" y="24" width="120" height="16" rx="6" fill="#152249"/><rect x="20" y="60" width="90" height="10" rx="5" fill="#c9d1dc"/><rect x="20" y="82" width="110" height="10" rx="5" fill="#c9d1dc"/><rect x="20" y="104" width="70" height="10" rx="5" fill="#c9d1dc"/><text x="80" y="160" text-anchor="middle" font-family="Alexandria" font-weight="900" font-size="34" fill="#e05a5a">AED</text></symbol>
  <symbol id="ctable" viewBox="0 0 260 120"><rect width="260" height="26" rx="10" fill="#7c5132"/><rect x="22" y="26" width="16" height="94" rx="6" fill="#9a6640"/><rect x="222" y="26" width="16" height="94" rx="6" fill="#9a6640"/></symbol>
  <symbol id="i-lock" viewBox="0 0 100 100"><path d="M30 44V32a20 20 0 0 1 40 0v12" stroke="#8fc9f2" stroke-width="10" fill="none"/><rect x="18" y="42" width="64" height="50" rx="12" fill="#8fc9f2"/><circle cx="50" cy="64" r="8" fill="#152249"/></symbol>
</defs></svg>

<!-- S1 HOOK 0–3.5 -->
<section class="scene navybg" id="s1" data-in="0" data-out="3.5"><div class="grain"></div>
  <div class="abs center ax" dir="rtl" style="top:620px;font-size:130px"><span class="w a up" style="--d:.05s">مسافر</span></div>
  <div class="abs center" dir="rtl" style="top:900px">
    <span class="w ax blue a up" style="--d:.3s;font-size:190px;white-space:nowrap"><span>طويـ</span><span class="kbar" data-w="560" data-fit="1050" data-t0=".65" data-t1="1.35"><span class="kg">ـ</span><span class="kitems"><svg class="it" id="kplane" style="bottom:30px;width:170px;height:85px;transform:scaleX(-1)"><use href="#plane"/></svg></span></span><span>ـل؟</span></span>
  </div>
</section>

<!-- S2 RENT ON AN EMPTY FLAT 3.5–8 -->
<section class="scene greybg" id="s2" data-in="3.5" data-out="8">
  <div class="wall" style="background:#e9eef5"></div>
  <div class="floor"></div>
  <div class="cal a pop" style="--d:3.7s;left:410px;top:640px"><div class="top"></div><div class="n ltr" id="month">1</div><div class="l" dir="rtl" id="monthL">شهر</div></div>
  <svg class="it" style="left:60px;top:1110px;width:110px;height:360px"><use href="#lamp"/></svg>
  <svg class="it" style="left:170px;top:1204px;width:470px;height:266px"><use href="#sofa"/></svg>
  <svg class="it" style="left:650px;top:1250px;width:190px;height:220px"><use href="#chair"/></svg>
  <svg class="it" style="left:300px;top:1480px;width:250px;height:115px"><use href="#ctable"/></svg>
  <svg class="it" style="left:870px;top:1170px;width:150px;height:300px"><use href="#wardrobe"/></svg>
  <div class="abs" id="bills" style="inset:0"></div>
  <div class="abs center ax navy" dir="rtl" style="top:200px;font-size:100px">
    <span class="w a up" style="--d:3.6s">ليش</span> <span class="w a up" style="--d:3.72s">تدفع</span> <span class="w a up" style="--d:3.84s">إيجار</span><br>
    <span class="w a up" style="--d:5.2s">وشقتك</span> <span class="w a up" style="--d:5.34s"><span class="mk" style="--md:5.7s">فاضية؟</span></span>
  </div>
</section>

<!-- S3 STORE IT 8–11 -->
<section class="scene greybg" id="s3" data-in="8" data-out="11"><div class="grain"></div>
  <div class="abs center tj navy a up" dir="rtl" style="--d:8.05s;top:150px;font-size:74px;line-height:1.3">سلّم شقتك…<br>وخزّن أغراضك عند</div>
  <div class="logo" style="top:400px;width:520px;color:var(--navy)">
    <svg viewBox="0 0 2100 1000" class="a reveal" style="--d:8.25s;animation-duration:.7s"><use href="#lg-script"/></svg>
    <svg viewBox="0 0 2100 230" class="a stor" style="--d:8.75s;margin-top:56px"><use href="#lg-storage"/></svg>
  </div>
  <div class="unit4" style="left:170px;top:820px;width:740px;height:620px">
    <svg class="it fly" style="--d:8.5s;--fx:900px;--fy:-100px;--fr:20deg;left:40px;top:330px;width:420px;height:238px"><use href="#sofa"/></svg>
    <svg class="it fly" style="--d:8.72s;--fx:900px;--fy:200px;--fr:30deg;left:480px;top:360px;width:190px;height:210px"><use href="#chair"/></svg>
    <svg class="it fly" style="--d:8.9s;--fx:-800px;--fy:-400px;--fr:-25deg;left:560px;top:60px;width:150px;height:290px"><use href="#wardrobe"/></svg>
    <svg class="it fly" style="--d:9.04s;--fx:900px;--fy:-300px;--fr:35deg;left:120px;top:200px;width:250px;height:115px"><use href="#ctable"/></svg>
    <svg class="it fly" style="--d:9.15s;--fx:-800px;--fy:-500px;--fr:-30deg;left:410px;top:150px;width:80px;height:200px"><use href="#lamp"/></svg>
    <div class="door dopen" style="--d:8.2s"></div>
    <div class="door dclose" style="--d:9.7s"></div>
  </div>
  <svg class="abs a pop" style="--d:10.1s;left:440px;top:1020px;width:200px;height:200px;z-index:10;filter:drop-shadow(0 20px 30px rgba(0,0,0,.3))"><use href="#i-lock"/></svg>
</section>

<!-- S4 TRAVEL 11–17 -->
<section class="scene navybg" id="s4" data-in="11" data-out="17"><div class="grain"></div>
  <div class="abs center ax" dir="rtl" style="top:200px;font-size:110px">
    <span class="w a up" style="--d:11.1s">سافر</span> <span class="w a up" style="--d:11.22s"><span class="mk" style="--md:11.55s">وانت مرتاح</span></span>
  </div>
  <div class="path" style="left:60px;right:60px;top:640px"></div>
  <svg class="it" id="plane2" style="top:560px;width:260px;height:130px;transform:scaleX(-1)"><use href="#plane"/></svg>
  <div class="cal" style="left:90px;top:900px;width:280px;height:280px"><div class="top"></div><div class="n ltr" id="month2" style="font-size:110px;line-height:140px">1</div><div class="l" dir="rtl" id="month2L">شهر</div></div>
  <div class="unit4" style="left:470px;top:860px;width:520px;height:440px">
    <svg class="it" style="left:30px;top:220px;width:300px;height:170px"><use href="#sofa"/></svg>
    <svg class="it" style="left:340px;top:150px;width:130px;height:250px"><use href="#wardrobe"/></svg>
    <div class="door" style="transform:none"></div>
  </div>
  <svg class="abs" style="left:660px;top:1010px;width:140px;height:140px;z-index:6"><use href="#i-lock"/></svg>
  <div class="abs" style="left:880px;top:780px;width:110px;height:110px;border-radius:28px;background:#0c1533;display:grid;place-items:center;border:3px solid rgba(255,255,255,.15)"><svg width="74" height="74"><use href="#i-cam"/></svg></div>
  <div class="abs" style="left:960px;top:792px;width:16px;height:16px;border-radius:8px;background:#f87171;animation:blink 1s steps(1) 11s infinite"></div>
  <div class="abs center a pop" dir="rtl" style="--d:13.2s;top:1440px"><span class="pill" style="background:var(--blue);color:var(--navy)">أغراضك بأمان <span class="ltr">24/7</span></span></div>
</section>

<!-- S5 COMING BACK 17–21.5 -->
<section class="scene greybg" id="s5" data-in="17" data-out="21.5"><div class="grain"></div>
  <div class="abs center ax navy" dir="rtl" style="top:200px;font-size:110px">
    <span class="w a up" style="--d:17.1s">ترجع…</span><br><span class="w a up" style="--d:18.0s">وأغراضك</span> <span class="w a up" style="--d:18.14s"><span class="mk" style="--md:18.5s">تنتظرك</span></span>
  </div>
  <div class="unit4" style="left:170px;top:760px;width:740px;height:620px">
    <svg class="it" style="left:40px;top:330px;width:420px;height:238px"><use href="#sofa"/></svg>
    <svg class="it" style="left:480px;top:360px;width:190px;height:210px"><use href="#chair"/></svg>
    <svg class="it" style="left:560px;top:60px;width:150px;height:290px"><use href="#wardrobe"/></svg>
    <svg class="it" style="left:120px;top:200px;width:250px;height:115px"><use href="#ctable"/></svg>
    <div class="door dopen" style="--d:18.3s"></div>
  </div>
  <svg class="it fly" style="--d:17.4s;--fx:-900px;--fy:0px;--fr:-10deg;left:60px;top:1240px;width:150px;height:206px;z-index:6"><use href="#suitcase"/></svg>
  <svg class="it a pop" style="--d:18.9s;left:230px;top:820px;width:70px;height:70px;z-index:6"><use href="#i-clean"/></svg>
  <svg class="it a pop" style="--d:19.0s;left:780px;top:880px;width:56px;height:56px;z-index:6"><use href="#i-clean"/></svg>
</section>

<!-- S6 CTA 21.5–25.5 -->
<section class="scene navybg" id="s6" data-in="21.5" data-out="26"><div class="grain"></div>
  <div class="sweepLight" style="--d:21.9s"></div>
  <div class="logo" style="top:360px;width:700px">
    <svg viewBox="0 0 2100 1000" class="a reveal" style="--d:21.6s;animation-duration:.7s"><use href="#lg-script"/></svg>
    <svg viewBox="0 0 2100 230" class="a stor" style="--d:22.15s;margin-top:70px"><use href="#lg-storage"/></svg>
  </div>
  <div class="abs center" style="top:1040px"><div class="a pop" style="--d:22.5s;display:inline-block"><div class="cta pulse" style="--d:23.2s" dir="rtl">احجز قبل سفرتك</div></div></div>
  <div class="abs center a up" style="--d:22.85s;top:1300px"><div class="wa"><svg width="92" height="92"><use href="#i-wa"/></svg><span class="ltr">050 3250551</span></div></div>
  <div class="abs center a fade" style="--d:23.1s;top:1470px;font:700 50px Alexandria;letter-spacing:2px;opacity:.9">ravelstorage.com</div>
</section>

<div id="panel"></div>

<script>
const scenes=[...document.querySelectorAll('.scene')];
const cuts=[3.5,8,11,17,21.5];
const clamp=x=>Math.max(0,Math.min(1,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ioC=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,f)=>a+(b-a)*f;
// rent bills pile up on the floor of the empty flat (accelerating)
const BL=[[120,1500,-12],[330,1560,8],[560,1520,-5],[760,1580,14],[220,1640,-20],[480,1680,6],[680,1700,-9],[880,1650,18],[60,1720,4],[390,1760,-14]];
const bills=document.getElementById('bills');
BL.forEach((b,i)=>{const d=4.2+2.6*Math.sqrt(i/BL.length);bills.insertAdjacentHTML('beforeend',`<svg class="it a drop" style="--d:${d.toFixed(2)}s;left:${b[0]}px;top:${b[1]}px;width:120px;height:150px;rotate:${b[2]}deg"><use href="#bill"/></svg>`)});
const kbars=[...document.querySelectorAll('.kbar')];
{{KBAR_INIT}}
const monthWord=n=>n==1?'شهر':n==2?'شهرين':'شهور';
window.setTime=function(t){
  scenes.forEach(s=>{s.style.display=(t>=+s.dataset.in&&t<+s.dataset.out)?'block':'none'});
  let x=110;for(const c of cuts){if(t>=c-.3&&t<c)x=lerp(110,0,ioC(seg(t,c-.3,c)));else if(t>=c&&t<c+.3)x=lerp(0,-110,ioC(seg(t,c,c+.3)));}
  document.getElementById('panel').style.transform=`translateX(${x}%)`;
  kbars.forEach(k=>{if(!k._w0)return;const W=+k.dataset.w*ioC(seg(t,+k.dataset.t0,+k.dataset.t1));k.style.width=W+'px';k.firstElementChild.style.transform=`scaleX(${(W+10)/k._w0})`;});
  // plane glides along the stretched word
  const kp=document.getElementById('kplane'),kb=kbars[0];if(kb&&kb._w0){const W=parseFloat(kb.style.width)||0;kp.style.right=(lerp(-60,W-110,ioC(seg(t,1.2,3.1))))+'px';kp.style.opacity=seg(t,1.1,1.3);}
  const m1=Math.max(1,Math.round(6*seg(t,3.9,7.2)));document.getElementById('month').textContent=m1;document.getElementById('monthL').textContent=monthWord(m1);
  const m2=Math.max(1,Math.round(6*seg(t,11.4,16.4)));document.getElementById('month2').textContent=m2;document.getElementById('month2L').textContent=monthWord(m2);
  document.getElementById('plane2').style.left=lerp(1100,-300,seg(t,11.2,16.6))+'px';
  document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000});
};
</script>
</body>
</html>
