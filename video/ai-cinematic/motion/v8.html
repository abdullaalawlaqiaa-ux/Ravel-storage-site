<script>
const clamp=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,f)=>a+(b-a)*f;
const ioC=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, oC=x=>1-Math.pow(1-x,3), iC=x=>x*x*x;
const $=id=>document.getElementById(id);
const scenes=[...document.querySelectorAll('.scene')];
const NS='http://www.w3.org/2000/svg';
// garments on the rail
const GC=['#d9c7a5','#f4f2ee','#9aa0a8','#c49a6c','#7d8457'];const gm=$('garments');
GC.forEach((c,i)=>{const x=-200+i*100;const g=document.createElementNS(NS,'g');g.setAttribute('id','gm'+i);
 g.innerHTML=`<path d="M${x} -752 q0 -22 14 -22" fill="none" stroke="#8d6b47" stroke-width="5"/><path d="M${x-50} -700 L${x} -740 L${x+50} -700 Z" fill="#8d6b47"/><path d="M${x-58} -702 L${x+58} -702 L${x+52} ${-330-(i%2)*80} L${x-52} ${-330-(i%2)*80} Z" fill="${c}"/>`;gm.appendChild(g);});
// cubbies
const cb=$('cubbies');[0,1,2].forEach(i=>{const x=100+i*300;cb.insertAdjacentHTML('beforeend',`<rect x="${x}" y="700" width="280" height="520" rx="10" fill="#e9e3d8"/><polygon points="${x},700 ${x+280},700 ${x+250},740 ${x+30},740" fill="#dcd4c6"/><rect x="${x+30}" y="740" width="220" height="440" fill="#f3eee5"/><rect x="${x}" y="1220" width="280" height="22" fill="#e2dccf"/>`)});
cb.insertAdjacentHTML('beforeend','<rect x="60" y="1300" width="960" height="320" rx="12" fill="#f4f0e8"/>');

// corridor projection
const corr=$('corr');
function quad(pts,fill,extra=''){return `<polygon points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${fill}" ${extra}/>`;}
function drawCorridor(t){
 const k=ioC(seg(t,12,15));
 const cam={x:lerp(0,.55,k),y:lerp(2.3,1.05,k),z:lerp(0,6.2,k)},pitch=lerp(.32,.12,k),f=1000,cx=540,cy=960-pitch*f;
 const P=(X,Y,Z)=>{const dz=Math.max(.35,Z-cam.z);return[cx+f*(X-cam.x)/dz,cy-f*(Y-cam.y)/dz]};
 const W=2,H=3,ZF=40;let s='';
 s+=`<rect width="1080" height="1920" fill="#f3efe7"/>`;
 s+=quad([P(-W,H,cam.z+.35),P(W,H,cam.z+.35),P(W,H,ZF),P(-W,H,ZF)],'#faf7f1');
 s+=quad([P(-W,0,cam.z+.35),P(W,0,cam.z+.35),P(W,0,ZF),P(-W,0,ZF)],'url(#floorG)');
 s+=quad([P(-W,0,cam.z+.35),P(-W,H,cam.z+.35),P(-W,H,ZF),P(-W,0,ZF)],'#ece5d8');
 s+=quad([P(W,0,cam.z+.35),P(W,H,cam.z+.35),P(W,H,ZF),P(W,0,ZF)],'#e7dfd1');
 s+=quad([P(-W,0,ZF),P(W,0,ZF),P(W,H,ZF),P(-W,H,ZF)],'#f7f3ec');
 // ceiling lights + floor pools
 for(let z=2;z<ZF;z+=2.4){if(z<cam.z+.5)continue;const a=P(-.35,H,z),b=P(.35,H,z),c=P(0,0,z);const dz=z-cam.z;
  s+=`<ellipse cx="${((a[0]+b[0])/2).toFixed(1)}" cy="${a[1].toFixed(1)}" rx="${(Math.abs(b[0]-a[0])/2).toFixed(1)}" ry="${(60/dz).toFixed(1)}" fill="#fff4dc"/>`;
  s+=`<ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(900/dz).toFixed(1)}" ry="${(200/dz).toFixed(1)}" fill="#ffe2b8" opacity=".35"/>`;}
 // doors on both walls, far to near
 const doors=[];for(let i=0;i<9;i++){const z0=2.2+i*2.0;doors.push({X:W,z0,z1:z0+1.5,n:201+i},{X:-W,z0,z1:z0+1.5,n:211+i});}
 doors.sort((a,b)=>b.z0-a.z0).forEach(d=>{if(d.z1<cam.z+.4)return;const z0=Math.max(d.z0,cam.z+.4),X=d.X,dh=2.4;
  s+=quad([P(X,0,z0),P(X,0,d.z1),P(X,dh,d.z1),P(X,dh,z0)],'#4a78a8');
  for(let r=1;r<10;r++){const y=dh*r/10;const a=P(X,y,z0),b=P(X,y,d.z1);s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#35608c" stroke-width="${Math.max(1,6/(z0-cam.z)).toFixed(2)}"/>`;}
  s+=quad([P(X,dh,z0),P(X,dh,d.z1),P(X,dh+.28,d.z1),P(X,dh+.28,z0)],'#3f6896');
  // plate above the door
  const zm=(d.z0+d.z1)/2;if(zm>cam.z+.5){const pa=P(X,dh+.45,zm-.22),pb=P(X,dh+.45,zm+.22),pc=P(X,dh+.7,zm);
   const pts=[P(X,dh+.36,zm-.25),P(X,dh+.36,zm+.25),P(X,dh+.62,zm+.25),P(X,dh+.62,zm-.25)];s+=quad(pts,'url(#steel)','stroke="#8d96a3" stroke-width="1"');
   const cxp=(pts[0][0]+pts[1][0]+pts[2][0]+pts[3][0])/4,cyp=(pts[0][1]+pts[1][1]+pts[2][1]+pts[3][1])/4,h=Math.abs(pts[0][1]-pts[3][1]),w=Math.abs(pts[1][0]-pts[0][0]);
   if(h>6)s+=`<text class="plate" x="${cxp.toFixed(1)}" y="${(cyp+h*.28).toFixed(1)}" text-anchor="middle" font-size="${(h*.78).toFixed(1)}" fill="#1f2a44" transform="translate(${cxp.toFixed(1)} 0) scale(${Math.min(1,Math.max(.25,w/(h*2.2))).toFixed(3)} 1) translate(${(-cxp).toFixed(1)} 0)">${d.n}</text>`;}
 });
 s+=`<rect width="1080" height="1920" fill="url(#warmGlow)" opacity=".18"/>`;
 corr.innerHTML=s;
}

window.setTime=function(t){
 scenes.forEach(s=>s.style.display=(t>=+s.dataset.in&&t<+s.dataset.out)?'block':'none');
 // S1: already moving at frame 1; shutter rises, camera tilts down from the housing
 const p=ioC(seg(t,-.35,3.3));$('shutter').setAttribute('transform',`translate(0 ${(-980*p).toFixed(1)})`);
 $('spill').setAttribute('opacity',(.55*seg(t,.6,3.3)).toFixed(3));
 const c1=ioC(seg(t,-.35,3.5));$('cam1').style.transform=`translateY(${lerp(470,0,c1)}px) scale(${lerp(1.18,1,c1)})`;
 // S2a: box carried in from the right and set on the shelf
 const a1=oC(seg(t,4.0,4.9)),a2=ioC(seg(t,4.95,5.15)),a3=iC(seg(t,5.25,5.8));
 const bx=lerp(1100,560,a1)+lerp(0,-14,a2)+lerp(0,700,a3)*0,by=lerp(690,800,oC(seg(t,4.5,4.95)));
 $('carry2a').setAttribute('transform',`translate(${bx.toFixed(1)} ${by.toFixed(1)})`);
 // after placing, only the arms leave: split by moving the arm layers
 const armsOut=lerp(0,640,a3);[...$('carry2a').children].forEach((el,i)=>{if(i>0)el.setAttribute('transform',`translate(${armsOut} 0)`)});
 $('cam2a').style.transform=`translateY(${lerp(70,-50,ioC(seg(t,4,6)))}px)`;
 // S2b: one push, rail coasts deeper into the unit
 const push=oC(seg(t,6.05,6.45)),coast=oC(seg(t,6.3,7.6));
 const rs=lerp(1,.66,coast),rx=lerp(600,530,coast),ry=lerp(1800,1360,coast);
 $('rail').setAttribute('transform',`translate(${rx} ${ry}) scale(${rs})`);
 for(let i=0;i<5;i++){const sw=Math.sin((t-6.3)*9+i)*6*Math.exp(-Math.max(0,t-6.3)*1.6)*(t>6.3?1:0);$('gm'+i).setAttribute('transform',`rotate(${sw.toFixed(2)} ${-200+i*100} -752)`);}
 const ax=lerp(1080,846,oC(seg(t,6.0,6.15)))+lerp(0,640,iC(seg(t,6.45,7.0)));
 $('arm2b').setAttribute('transform',`translate(${ax.toFixed(1)} ${lerp(1420,1395,push).toFixed(1)})`);
 $('cam2b').style.transform=`translateY(${lerp(60,-40,ioC(seg(t,6,8)))}px)`;
 // S2c: hand on saddle tilts the bike back against the wall, then leaves
 const tl=ioC(seg(t,8.15,9.2));$('bike').setAttribute('transform',`translate(${560} ${lerp(1560,1530,tl)}) scale(${lerp(1,.96,tl)}) rotate(${lerp(0,-3,tl)})`);
 const bs=$('bikeShadow');bs.setAttribute('cy',lerp(1585,1556,tl));
 $('arm2c').setAttribute('transform',`translate(${(lerp(700,1100,iC(seg(t,9.3,9.85)))+lerp(0,0,tl)).toFixed(1)} ${lerp(1040,1012,tl).toFixed(1)})`);
 $('cam2c').style.transform=`translateY(${lerp(60,-40,ioC(seg(t,8,10)))}px)`;
 // S2d: toy box slides into the centre cubby, hands withdraw down
 const sl=ioC(seg(t,10.1,11.1));$('toybox').setAttribute('transform',`translate(540 ${lerp(1330,1010,sl).toFixed(1)}) scale(${lerp(1.12,.86,sl).toFixed(3)})`);
 const hw=iC(seg(t,11.15,11.7));$('hands2d').setAttribute('transform',`translate(540 ${(lerp(1430,1130,sl)+lerp(0,800,hw)).toFixed(1)}) scale(${lerp(1.12,.9,sl).toFixed(3)})`);
 $('cam2d').style.transform=`translateY(${lerp(60,-40,ioC(seg(t,10,12)))}px)`;
 // S3a corridor glide
 if(t>=12&&t<15)drawCorridor(t);
 // S3b padlock: shackle clicks shut, glint, slow push-in
 const sh=seg(t,15.35,15.5);$('shackle').setAttribute('transform',`translate(0 ${lerp(-34,0,iC(sh)).toFixed(1)})`);
 $('glint').setAttribute('x',lerp(220,860,ioC(seg(t,15.9,16.6))).toFixed(1));
 const pz=ioC(seg(t,15,16.9));$('cam3b').style.transformOrigin='540px 1330px';$('cam3b').style.transform=`scale(${lerp(1,1.32,pz)})`;
 // soft flash on hard cuts
 let fl=0;for(const c of [4,6,8,10,12,15]){if(t>=c&&t<c+.12)fl=.35*(1-(t-c)/.12);}$('flash').style.opacity=fl;
};
window.ready=document.fonts.ready.then(()=>window.setTime(0));
</script></body></html>
