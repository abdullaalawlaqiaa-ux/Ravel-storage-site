<style>
:root{--navy:#152249;--navy2:#0c1533;--blue:#8fc9f2;--blueD:#2e78b8;--grey:#eef1f6;--grey2:#dde3ec}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:'Tajawal',sans-serif;color:#fff}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.abs{position:absolute}
.center{left:0;right:0;text-align:center}
.ax{font-family:'Alexandria',sans-serif;font-weight:900;line-height:1.25}
.ax8{font-family:'Alexandria',sans-serif;font-weight:800;line-height:1.3}
.tj{font-family:'Tajawal',sans-serif;font-weight:800}
.blue{color:var(--blue)} .blueD{color:var(--blueD)} .navy{color:var(--navy)}
.w{display:inline-block}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.it{position:absolute}

.a{animation-fill-mode:both;animation-delay:var(--d,0s)}
.up{animation-name:up;animation-duration:.6s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.pop{animation-name:pop;animation-duration:.5s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
.drop{animation-name:drop;animation-duration:.6s;animation-timing-function:cubic-bezier(.5,0,.75,0)}
.fade{animation-name:fade;animation-duration:.5s;animation-timing-function:ease-out}
.slideR{animation-name:slideR;animation-duration:.7s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.reveal{animation-name:reveal;animation-duration:.9s;animation-timing-function:cubic-bezier(.65,0,.35,1)}
.stor{animation-name:stor;animation-duration:.6s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
@keyframes up{0%{transform:translateY(90px);opacity:0;filter:blur(12px)}100%{transform:none;opacity:1;filter:blur(0)}}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes drop{0%{transform:translateY(-1500px)}85%{transform:translateY(0)}92%{transform:scale(1.06,.9)}100%{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideR{from{transform:translateX(900px);opacity:0}to{transform:none;opacity:1}}
@keyframes reveal{from{clip-path:inset(-5% 100% -5% -5%)}to{clip-path:inset(-5% -5% -5% -5%)}}
@keyframes stor{from{transform:scaleX(1.35);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:blur(0)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-14px) rotate(-.7deg)}75%{transform:translateX(14px) rotate(.7deg)}}
@keyframes wob{0%,100%{transform:none}50%{transform:scale(1.03,.98)}}
@keyframes mark{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes sweep{from{transform:translateX(-1400px) rotate(18deg)}to{transform:translateX(1400px) rotate(18deg)}}

.mk{position:relative;display:inline-block;z-index:0;padding:0 .18em}
.mk::before{content:"";position:absolute;left:0;right:0;top:52%;height:38%;background:var(--blue);opacity:.6;z-index:-1;border-radius:8px;transform-origin:right;animation:mark .45s cubic-bezier(.65,0,.35,1) var(--md) both}

#panel{position:absolute;inset:0;background:var(--blue);z-index:60;transform:translateX(110%)}
#panel::after{content:"";position:absolute;inset:0 0 0 auto;width:140px;background:var(--navy)}
.logo{position:absolute;left:0;right:0;margin:0 auto;color:#fff}
.logo svg{display:block;width:100%;fill:currentColor}

.navybg{background:radial-gradient(1100px 900px at 50% 35%,#1d2d60 0%,var(--navy) 55%,var(--navy2) 100%)}
.greybg{background:radial-gradient(1100px 1000px at 50% 40%,#fff 0%,var(--grey) 55%,var(--grey2) 100%);color:var(--navy)}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1.5px,transparent 1.5px);background-size:44px 44px}
.greybg .grain{background-image:radial-gradient(rgba(21,34,73,.06) 1.5px,transparent 1.5px)}
.sweepLight{position:absolute;top:-400px;left:0;width:260px;height:2800px;background:linear-gradient(90deg,transparent,rgba(143,201,242,.18),transparent);animation:sweep 3s cubic-bezier(.45,0,.55,1) var(--d) both}

.kbar{display:inline-block;position:relative;white-space:nowrap;text-align:right}
.kg{display:inline-block;transform-origin:right center;margin-right:-5px}
.kitems{position:absolute;left:0;right:0;height:0}

/* grid scene */
.grid{position:absolute}
.tile{position:absolute;border-radius:10px;background:#fff;border:3px solid #d3dbe7}
.tile.on{background:var(--blue);border-color:#5fa9de}
.chip{display:inline-block;background:var(--navy);color:#fff;font-family:'Alexandria';font-weight:800;font-size:58px;padding:10px 40px 18px;border-radius:999px}

.feat{position:absolute;left:90px;right:90px;height:150px;border-radius:75px;background:#fff;color:var(--navy);display:flex;align-items:center;gap:30px;padding:0 24px 0 50px;font-family:'Alexandria';font-weight:800;font-size:56px;box-shadow:0 24px 50px rgba(0,0,0,.3)}
.feat .ib{width:108px;height:108px;border-radius:54px;background:var(--navy);display:grid;place-items:center;flex:none}
.cta{display:inline-block;background:var(--blue);color:var(--navy);font-family:'Alexandria';font-weight:900;font-size:80px;padding:24px 70px 30px;border-radius:999px;box-shadow:0 24px 60px rgba(143,201,242,.35)}
.cta.pulse{animation:pulse 1s ease-in-out var(--d) infinite}
.wa{display:inline-flex;align-items:center;gap:24px;background:#fff;color:var(--navy);border-radius:999px;padding:16px 44px 16px 24px;font-family:'Alexandria';font-weight:800;font-size:62px}
</style>

<script>
const scenes=[...document.querySelectorAll('.scene')];
const cuts=[3.5,7,10,18,22];
const clamp=x=>Math.max(0,Math.min(1,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ioC=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const oBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,f)=>a+(b-a)*f;

// S2 pile of boxes: fills the shop bottom-up, then overflows onto the roof and sides (accelerating)
const pile=document.getElementById('pile');const PB=[];
for(let r=0;r<4;r++)for(let c=0;c<4;c++)PB.push([40+c*140,690-118*(r+1),130,113]);
PB.push([60,30,120,105],[250,-10,140,122],[440,25,120,105],[-140,580,120,105],[650,580,130,113],[330,-120,110,96]);
PB.forEach((b,i)=>{const d=3.75+2.3*Math.sqrt(i/PB.length);pile.insertAdjacentHTML('beforeend',`<svg class="it a pop" style="--d:${d.toFixed(2)}s;left:${b[0]}px;top:${b[1]}px;width:${b[2]}px;height:${b[3]}px;transform-origin:50% 100%"><use href="#box"/></svg>`)});

// S4 grids
const PH=[{t:10.4,g:'gA',cols:6,rows:5,tile:150,n:12,w:4,label:'مطعم',end:12.9},
          {t:12.9,g:'gA',cols:6,rows:5,tile:150,n:20,w:5,label:'محل أثاث',end:15.4},
          {t:15.4,g:'gB',cols:14,rows:10,tile:64,n:110,w:11,label:'شركة نقل',end:99}];
const grids={};
for(const id of ['gA','gB']){const p=PH.find(x=>x.g==id);const el=document.getElementById(id);grids[id]=[];
  for(let r=0;r<p.rows;r++)for(let c=0;c<p.cols;c++){const d=document.createElement('div');d.className='tile';
    Object.assign(d.style,{right:(c*p.tile+3)+'px',top:(r*p.tile+3)+'px',width:(p.tile-6)+'px',height:(p.tile-6)+'px'});el.appendChild(d);grids[id].push({el:d,r,c});}}
PH.forEach(p=>{const h=p.n/p.w,co=Math.floor((p.cols-p.w)/2),ro=Math.floor((p.rows-h)/2);
  p.lit=new Map();for(let i=0;i<p.n;i++){const r=ro+Math.floor(i/p.w),c=co+i%p.w;p.lit.set(r*p.cols+c,p.t+.25+1.3*Math.sqrt(i/p.n));}});
const chip=document.getElementById('chip'),cnt=document.getElementById('cnt');
const itA=document.getElementById('itA'),itB=document.getElementById('itB'),itC=document.getElementById('itC');

const kbars=[...document.querySelectorAll('.kbar')];
async function initK(){
  await document.fonts.load('900 175px Alexandria','ـضاق');await document.fonts.ready;
  scenes.forEach(x=>x.style.display='block');
  const cv=document.createElement('canvas');cv.width=800;cv.height=800;const cx=cv.getContext('2d');
  for(const k of kbars){
    const kg=k.querySelector('.kg');const fs=getComputedStyle(kg).fontSize;
    k._w0=kg.getBoundingClientRect().width;
    cx.clearRect(0,0,800,800);cx.font=`900 ${fs} Alexandria`;cx.fillText('ـ',100,600);
    const W=Math.max(4,k._w0|0),d=cx.getImageData(100,0,W,800).data;let top=600;
    for(let y=0;y<800;y++){let hit=false;for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>128){hit=true;break}if(hit){top=y;break}}
    const m=document.createElement('i');m.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';k.appendChild(m);
    const base=m.getBoundingClientRect().top,bot=k.getBoundingClientRect().bottom;m.remove();
    if(k.dataset.fit){const o=k.previousElementSibling.getBoundingClientRect().width+k.nextElementSibling.getBoundingClientRect().width;k.dataset.w=Math.floor(+k.dataset.fit-o);}
    const ki=k.querySelector('.kitems');
    if(ki){ki.style.bottom=(bot-base+(600-top))+'px';if(k.dataset.base){ki.style.transformOrigin='right bottom';ki.style.transform=`scale(${k.dataset.w/k.dataset.base})`;}}
  }
}
window.ready=initK().then(()=>window.setTime(0));

window.setTime=function(t){
  scenes.forEach(s=>{s.style.display=(t>=+s.dataset.in&&t<+s.dataset.out)?'block':'none'});
  let x=110;for(const c of cuts){if(t>=c-.3&&t<c)x=lerp(110,0,ioC(seg(t,c-.3,c)));else if(t>=c&&t<c+.3)x=lerp(0,-110,ioC(seg(t,c,c+.3)));}
  document.getElementById('panel').style.transform=`translateX(${x}%)`;
  kbars.forEach(k=>{if(!k._w0)return;const W=+k.dataset.w*ioC(seg(t,+k.dataset.t0,+k.dataset.t1));k.style.width=W+'px';k.firstElementChild.style.transform=`scaleX(${(W+10)/k._w0})`;});
  // S4
  const pi=t<12.9?0:t<15.4?1:2,p=PH[pi];
  chip.textContent=p.label;
  let lit=0;
  for(const id of ['gA','gB'])grids[id].forEach((g,idx)=>{const ti=(PH[pi].g==id)?p.lit.get(idx):undefined;
    if(ti!==undefined&&t>=ti){lit++;const k=seg(t,ti,ti+.2);g.el.classList.add('on');g.el.style.transform=`scale(${.5+.5*oBack(k)})`;}
    else{g.el.classList.remove('on');g.el.style.transform='none';}});
  cnt.textContent=lit;
  // phase switch: chip pop, grid zoom from big tiles to small tiles
  chip.style.transform=`scale(${.6+.4*oBack(seg(t,p.t,p.t+.35))})`;
  const z=seg(t,15.2,15.6);const gA=document.getElementById('gA'),gB=document.getElementById('gB');
  gA.style.opacity=1-seg(t,15.2,15.45);gA.style.transform=`scale(${lerp(1,.45,ioC(z))})`;
  gB.style.opacity=seg(t,15.3,15.55);gB.style.transform=`scale(${lerp(2.2,1,ioC(z))})`;
  gA.style.transformOrigin=gB.style.transformOrigin='50% 50%';
  itA.style.opacity=1-seg(t,12.75,12.95);itA.style.display=t<12.95?'block':'none';
  itB.style.opacity=1-seg(t,15.2,15.4);itB.style.display=(t>=12.9&&t<15.4)?'block':'none';
  itC.style.display=t>=15.4?'block':'none';
  document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000});
};
</script>
